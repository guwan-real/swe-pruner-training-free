[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-pruner-training-free"
version = "0.1.0"
description = "Training-free context pruning experiments for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
model = [
  "numpy>=1.26",
  "safetensors>=0.4",
  "torch>=2.4",
  "transformers>=4.51,<5",
]
syntax = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.7"]
agent = ["PyYAML>=6.0"]
dev = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
tf-prune = "tf_pruning.cli:main"
tf-extract-signals = "scripts.extract_hf_signals:main"
tf-prune-serve = "integrations.http_server:main"
zero-forward-prune-serve = "zero_forward_pruning.http_server:main"
zero-forward-prune-preflight = "zero_forward_pruning.preflight:main"
posterior-history-mini-preflight = "posterior_history_pruning.mini_adapter.preflight:main"
agent-context = "agent_context.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "tf_pruning*",
  "tasks*",
  "evaluation*",
  "integrations*",
  "agent_eval*",
  "scripts*",
  "zero_forward_pruning*",
  "posterior_history_pruning*",
  "agent_context*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
